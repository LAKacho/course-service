doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        use_savepoints: true
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        # Avoid rewriting loaded proxy files on every request on Windows.
        auto_generate_proxy_classes: FILE_NOT_EXISTS_OR_CHANGED
        auto_mapping: true
        mappings:
            Access:
                type: xml
                dir: '%kernel.project_dir%/src/Access/Infrastructure/Persistence/Mapping'
                prefix: App\Access\Domain\Entity
                alias: Access
            Assessment:
                type: xml
                dir: '%kernel.project_dir%/src/Assessment/Infrastructure/Persistence/Mapping'
                prefix: App\Assessment\Domain\Entity
                alias: Assessment
            Auth:
                type: xml
                dir: '%kernel.project_dir%/src/Auth/Infrastructure/Persistence/Mapping'
                prefix: App\Auth\Domain\Entity
                alias: Auth
            Coding:
                type: xml
                dir: '%kernel.project_dir%/src/Coding/Infrastructure/Persistence/Mapping'
                prefix: App\Coding\Domain\Entity
                alias: Coding
            Learning:
                type: xml
                dir: '%kernel.project_dir%/src/Learning/Infrastructure/Persistence/Mapping'
                prefix: App\Learning\Domain\Entity
                alias: Learning
            Mentor:
                type: xml
                dir: '%kernel.project_dir%/src/Mentor/Infrastructure/Persistence/Mapping'
                prefix: App\Mentor\Domain\Entity
                alias: Mentor
            Student:
                type: xml
                dir: '%kernel.project_dir%/src/Student/Infrastructure/Persistence/Mapping'
                prefix: App\Student\Domain\Entity
                alias: Student
